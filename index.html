<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d19">
  <meta name="description" content="AnimePlex — open and share your favorite anime and movies.">
  <title>AnimePlex — Watch & Share</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 7%,#34205b 0,transparent 45%),#090d19;color:#f8f7ff;display:grid;place-items:center;padding:20px}
    main{width:min(100%,550px);padding:52px 35px;text-align:center;background:rgba(23,26,45,.8);border:1px solid #ffffff20;border-radius:28px;box-shadow:0 32px 90px #0005}
    .mark{display:inline-grid;place-items:center;width:68px;height:68px;border-radius:22px;font-weight:800;font-size:30px;background:linear-gradient(135deg,#9365ff,#e94e9c);box-shadow:0 12px 42px #9c50e844}
    h1{margin:24px 0 8px;font-size:clamp(32px,6vw,48px);letter-spacing:-.04em}p{line-height:1.65;color:#aeb5ca;margin:0 auto 26px;max-width:375px}
    .pill{display:inline-flex;align-items:center;gap:9px;border:1px solid #a985ff66;border-radius:40px;padding:9px 14px;color:#d8c9ff;background:#8e60ff18;font-size:13px;margin-bottom:20px}
    a{color:#d6c5ff}footer{font-size:12px;color:#7f899d;margin-top:28px}
  </style>
</head>
<body>
 <main>
  <span class="pill">AnimePlex • Official link hub</span>
  <div><span class="mark" aria-hidden="true">A</span></div>
  <h1>AnimePlex</h1>
  <p>Discover, watch and share your favorite anime and movies. Shared links will open directly in the app once the deep-link integration is configured.</p>
  <footer>AnimePlex • Deep-link landing website</footer>
 </main>
</body>
</html>
